name: HELLBREAK Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Hellbreak.exe
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract Hellbreak project
        shell: pwsh
        run: |
          @'
          import pathlib
          import shutil
          import zipfile

          root = pathlib.Path.cwd()

          archives = sorted(root.glob("*.zip"))

          if archives:
              archive = archives[0]

              print("Found ZIP:", archive.name)

              extract_dir = root / "_hellbreak_extract"

              extract_dir.mkdir(exist_ok=True)

              with zipfile.ZipFile(archive, "r") as z:
                  z.extractall(extract_dir)

              candidates = [
                  p.parent
                  for p in extract_dir.rglob("CMakeLists.txt")
                  if (p.parent / "src" / "main.cpp").exists()
              ]

              if not candidates:
                  raise RuntimeError(
                      "Cannot find Hellbreak project inside ZIP"
                  )

              source = candidates[0]

              print("Project directory:", source)

              for item in source.iterdir():
                  target = root / item.name

                  if target.exists():
                      if target.is_dir():
                          shutil.rmtree(target)
                      else:
                          target.unlink()

                  if item.is_dir():
                      shutil.copytree(item, target)
                  else:
                      shutil.copy2(item, target)

          cmake = root / "CMakeLists.txt"
          main = root / "src" / "main.cpp"

          if not cmake.exists() or not main.exists():
              raise RuntimeError(
                  "Missing CMakeLists.txt or src/main.cpp"
              )

          print("Hellbreak project extracted successfully.")
          '@ | python -

      - name: Verify source files
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          files = [
              "src/main.cpp",
              "src/Game.cpp",
              "src/Game.h",
              "src/Engine/Renderer.cpp",
              "src/Engine/Renderer.h",
              "src/Engine/Raycaster.cpp",
              "src/Engine/Raycaster.h",
              "src/World/Map.cpp",
              "src/World/Map.h",
              "src/World/Player.cpp",
              "src/World/Player.h",
              "src/World/Enemy.cpp",
              "src/World/Enemy.h",
          ]

          for filename in files:
              path = Path(filename)

              if not path.exists():
                  raise RuntimeError(
                      "Missing source file: " + filename
                  )

              print(
                  "OK:",
                  filename,
                  "(",
                  path.stat().st_size,
                  "bytes )"
              )

          renderer = Path(
              "src/Engine/Renderer.cpp"
          ).read_text(encoding="utf-8-sig")

          raycaster = Path(
              "src/Engine/Raycaster.cpp"
          ).read_text(encoding="utf-8-sig")

          renderer_header = Path(
              "src/Engine/Renderer.h"
          ).read_text(encoding="utf-8-sig")

          if "map.at(" in raycaster:
              raise RuntimeError(
                  "Raycaster.cpp still contains map.at()!"
              )

          if "map.tile(" not in raycaster:
              raise RuntimeError(
                  "Raycaster.cpp does not use map.tile()!"
              )

          if "Renderer::renderWorld" in raycaster:
              raise RuntimeError(
                  "Raycaster.cpp contains Renderer code!"
              )

          if "enemy.alive" in renderer:
              raise RuntimeError(
                  "Renderer.cpp still uses enemy.alive!"
              )

          if "enemy.x()" not in renderer:
              raise RuntimeError(
                  "Renderer.cpp does not use enemy.x()!"
              )

          if "enemy.y()" not in renderer:
              raise RuntimeError(
                  "Renderer.cpp does not use enemy.y()!"
              )

          if "std::vector<Enemy>" not in renderer_header:
              raise RuntimeError(
                  "Renderer.h has an outdated render signature!"
              )

          print("All source checks passed!")
          '@ | python -

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DFETCHCONTENT_QUIET=OFF

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed!"
          }

      - name: Build Hellbreak
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel 2

          if ($LASTEXITCODE -ne 0) {
            throw "Hellbreak compilation failed!"
          }

      - name: Package Windows EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist

          $exe = "build/Release/Hellbreak.exe"

          if (!(Test-Path $exe)) {
            throw "Hellbreak.exe was not generated!"
          }

          Copy-Item $exe "dist/Hellbreak.exe"

          Compress-Archive `
            -Path "dist/Hellbreak.exe" `
            -DestinationPath "Hellbreak-Windows.zip" `
            -Force

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Hellbreak-Windows
          path: Hellbreak-Windows.zip
          if-no-files-found: error
